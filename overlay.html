<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>字幕オーバーレイ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1920px;
      height: 1080px;
      background: transparent;
      overflow: hidden;
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    }

    .route-container {
      position: absolute;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 0 80px;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
    }

    .route-container.visible {
      opacity: 1;
    }

    /* 経路A: 相手の発言。下から2段目に配置 */
    #route-a-container {
      bottom: 240px;
    }

    /* 経路B: 自分の発言確認用。最下部に配置 */
    #route-b-container {
      bottom: 60px;
    }

    .subtitle-box {
      background: rgba(0, 0, 0, 0.65);
      border-radius: 8px;
      padding: 12px 24px;
      max-width: 100%;
      text-align: center;
    }

    .route-label {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .original-text {
      color: #cccccc;
      font-size: 22px;
      line-height: 1.4;
      font-weight: 400;
    }

    /* 経路A: 相手の発言を読むため大きめ（既存と同程度）*/
    #route-a-container .translated-text {
      color: #ffffff;
      font-size: 36px;
      line-height: 1.4;
      font-weight: 700;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
    }

    /* 経路B: 自分の確認用なので中程度 */
    #route-b-container .translated-text {
      color: #e8e8e8;
      font-size: 30px;
      line-height: 1.4;
      font-weight: 700;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
    }

    #status {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff4444;
    }

    #status.connected {
      background: #44ff44;
    }
  </style>
</head>
<body>
  <div id="status"></div>

  <!-- 経路A: 相手の発言（下から2段目） -->
  <div id="route-a-container" class="route-container">
    <div class="subtitle-box">
      <div class="route-label">[相手]</div>
      <div class="original-text" id="route-a-original"></div>
    </div>
    <div class="subtitle-box">
      <div class="translated-text" id="route-a-translated"></div>
    </div>
  </div>

  <!-- 経路B: 自分の発言確認用（最下部） -->
  <div id="route-b-container" class="route-container">
    <div class="subtitle-box">
      <div class="route-label">[自分]</div>
      <div class="original-text" id="route-b-original"></div>
    </div>
    <div class="subtitle-box">
      <div class="translated-text" id="route-b-translated"></div>
    </div>
  </div>

  <script>
    // config.yaml の websocket.port を変更した場合はこの値も合わせて変更すること
    const WS_URL = "ws://localhost:8765";
    const FADE_OUT_DELAY = 5000;

    const routeAContainer = document.getElementById("route-a-container");
    const routeAOriginal = document.getElementById("route-a-original");
    const routeATranslated = document.getElementById("route-a-translated");

    const routeBContainer = document.getElementById("route-b-container");
    const routeBOriginal = document.getElementById("route-b-original");
    const routeBTranslated = document.getElementById("route-b-translated");

    const statusIndicator = document.getElementById("status");

    // フェードアウトタイマーは経路A・B それぞれ独立して管理
    let fadeOutTimerA = null;
    let fadeOutTimerB = null;

    const routeAElements = {
      container: routeAContainer,
      originalText: routeAOriginal,
      translatedText: routeATranslated,
    };

    const routeBElements = {
      container: routeBContainer,
      originalText: routeBOriginal,
      translatedText: routeBTranslated,
    };

    function showSubtitle(route, original, translated) {
      console.log(`[overlay] showSubtitle route=${route}`);  // デバッグ
      // OpenAI Realtime は原文と翻訳を独立したストリームで送るため、
      // 片方だけが入った payload が来る。空文字側は前回値を維持する。
      const elements = route === "b" ? routeBElements : routeAElements;

      let updated = false;
      if (original) {
        elements.originalText.textContent = original;
        updated = true;
      }
      if (translated) {
        elements.translatedText.textContent = translated;
        updated = true;
      }
      if (!updated) {
        return;
      }

      elements.container.classList.add("visible");

      // 経路ごとに独立したタイマーをリセット
      if (route === "b") {
        if (fadeOutTimerB) {
          clearTimeout(fadeOutTimerB);
        }
        fadeOutTimerB = setTimeout(() => {
          elements.container.classList.remove("visible");
        }, FADE_OUT_DELAY);
      } else {
        if (fadeOutTimerA) {
          clearTimeout(fadeOutTimerA);
        }
        fadeOutTimerA = setTimeout(() => {
          elements.container.classList.remove("visible");
        }, FADE_OUT_DELAY);
      }
    }

    function connect() {
      const ws = new WebSocket(WS_URL);

      ws.addEventListener("open", () => {
        console.log("[overlay] WebSocket connected");
        statusIndicator.classList.add("connected");
      });

      ws.addEventListener("message", (event) => {
        try {
          const data = JSON.parse(event.data);
          console.log("[overlay] msg received:", data);  // デバッグ
          // 後方互換: route フィールドがない既存メッセージは経路A として扱う
          const route = data.route ?? "a";
          if (data.original !== undefined && data.translated !== undefined) {
            showSubtitle(route, data.original, data.translated);
          }
        } catch (e) {
          console.error("メッセージのパースに失敗:", e);
        }
      });

      ws.addEventListener("close", () => {
        console.log("[overlay] WebSocket closed");
        statusIndicator.classList.remove("connected");
        setTimeout(connect, 3000);
      });

      ws.addEventListener("error", (e) => {
        console.error("[overlay] WebSocket error:", e);
        ws.close();
      });
    }

    connect();
  </script>
</body>
</html>
